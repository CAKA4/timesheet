<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Payroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    :root {
      --bg:#0f1110; --surface:#181c1a; --surface2:#1e2420;
      --border:#2a302c; --muted:#4a544e; --text:#e2e8e4; --label:#7a8c80;
      --green:#4ade80; --green-dim:#2d6b47; --green-bg:rgba(74,222,128,0.10);
      --red:#f87171; --red-bg:rgba(248,113,113,0.10);
      --amber:#fbbf24; --amber-bg:rgba(251,191,36,0.10);
      --blue:#60a5fa;
    }
    html,body { min-height:100%; background:var(--bg); color:var(--text); font-family:'IBM Plex Sans',sans-serif; font-size:16px; -webkit-font-smoothing:antialiased; }
    .shell { max-width:480px; margin:0 auto; padding-bottom:60px; }

    .topbar { padding:20px 24px 16px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; position:sticky; top:0; background:var(--bg); z-index:10; }
    .back-btn { width:34px; height:34px; background:var(--surface); border:1px solid var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; text-decoration:none; flex-shrink:0; -webkit-tap-highlight-color:transparent; }
    .back-btn svg { width:16px; height:16px; }
    .topbar-text { flex:1; }
    .topbar-title { font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; letter-spacing:0.02em; }
    .topbar-sub { font-size:12px; color:var(--muted); margin-top:1px; }

    /* Section wrapper */
    .section { margin:20px 24px 0; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px; }
    .section-title { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; color:var(--label); margin-bottom:14px; }

    /* Mark payroll */
    .btn-mark { width:100%; background:var(--green); color:#0f1110; border:none; border-radius:8px; padding:14px; font-family:'IBM Plex Mono',monospace; font-size:14px; font-weight:600; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .btn-mark:disabled { opacity:0.4; }
    .mark-status { margin-top:10px; font-size:13px; min-height:18px; }
    .mark-status.ok  { color:var(--green); }
    .mark-status.err { color:var(--red); }

    /* Cutoff list */
    .cutoff-list { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
    .cutoff-item { background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:12px 14px; }
    .cutoff-view { display:flex; justify-content:space-between; align-items:center; }
    .cutoff-date { font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--text); }
    .cutoff-actions { display:flex; gap:6px; }
    .btn-icon { background:none; border:1px solid var(--border); border-radius:6px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--muted); touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .btn-icon:hover { border-color:var(--text); color:var(--text); }
    .btn-icon.del:hover { border-color:var(--red); color:var(--red); }

    .cutoff-edit-form { display:none; margin-top:10px; border-top:1px solid var(--border); padding-top:10px; }
    .cutoff-edit-form.visible { display:block; }
    .cutoff-edit-row { display:flex; gap:8px; }
    .cutoff-input { flex:1; background:var(--bg); border:1px solid var(--border); border-radius:6px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; padding:9px 12px; outline:none; -webkit-appearance:none; }
    .cutoff-input:focus { border-color:var(--green); }
    .btn-save-cutoff { background:var(--green); color:#0f1110; border:none; border-radius:6px; padding:9px 14px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; cursor:pointer; touch-action:manipulation; white-space:nowrap; }
    .cutoff-status { font-size:12px; margin-top:6px; min-height:14px; }
    .cutoff-status.ok  { color:var(--green); }
    .cutoff-status.err { color:var(--red); }

    /* Projects */
    .projects-list { display:flex; flex-direction:column; gap:6px; margin-bottom:14px; }
    .project-item { display:flex; justify-content:space-between; align-items:center; background:var(--surface2); border:1px solid var(--border); border-radius:8px; padding:10px 14px; font-size:15px; }
    .add-row { display:flex; gap:8px; }
    .add-input { flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'IBM Plex Sans',sans-serif; font-size:15px; padding:11px 14px; outline:none; -webkit-appearance:none; }
    .add-input:focus { border-color:var(--green); }
    .btn-add { background:var(--surface2); border:1px solid var(--green); color:var(--green); border-radius:8px; padding:11px 16px; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; flex-shrink:0; }
    .btn-add:disabled { opacity:0.4; }
    .add-status { font-size:12px; margin-top:6px; min-height:16px; }
    .add-status.ok  { color:var(--green); }
    .add-status.err { color:var(--red); }

    /* Period cards */
    .periods-section { padding:0 24px; margin-top:20px; }
    .period-card { background:var(--surface); border:1px solid var(--border); border-radius:12px; margin-bottom:12px; overflow:hidden; }
    .period-header { padding:14px 18px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .period-label { font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; }
    .period-cutoff { font-size:12px; color:var(--muted); margin-top:2px; }
    .period-badge { padding:4px 12px; border-radius:20px; font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; }
    .period-badge.open   { background:var(--amber-bg); color:var(--amber); border:1px solid rgba(251,191,36,0.3); }
    .period-badge.closed { background:var(--green-bg); color:var(--green); border:1px solid var(--green-dim); }
    .period-body { display:none; border-top:1px solid var(--border); }
    .period-body.visible { display:block; }
    .emp-row { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--border); }
    .emp-row:last-child { border-bottom:none; }
    .emp-name { font-size:15px; font-weight:500; }
    .emp-hrs { font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--green); font-weight:600; }
    .emp-hrs.zero { color:var(--muted); }
    .period-total { display:flex; justify-content:space-between; padding:12px 18px; background:var(--surface2); border-top:1px solid var(--border); }
    .period-total-label { font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--label); }
    .period-total-val { font-family:'IBM Plex Mono',monospace; font-size:15px; font-weight:600; }

    .state-msg { text-align:center; padding:48px 24px; color:var(--muted); font-size:15px; line-height:1.6; }
    .state-msg .icon { font-size:32px; margin-bottom:10px; }
    .spinner { width:20px; height:20px; border:2px solid var(--border); border-top-color:var(--green); border-radius:50%; animation:spin 0.8s linear infinite; display:inline-block; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#e2e8e4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="topbar-text">
      <div class="topbar-title">PAYROLL</div>
      <div class="topbar-sub">Pay period summaries</div>
    </div>
  </div>

  <!-- Mark payroll -->
  <div class="section">
    <div class="section-title">Mark Payroll Submitted</div>

    <!-- Submit now -->
    <button class="btn-mark" id="markBtn">Submit Payroll Now (current time)</button>
    <div class="mark-status" id="markStatus"></div>

    <!-- Add a past cutoff date -->
    <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
      <div class="section-title" style="margin-bottom:10px;">Add Past Cutoff Date</div>
      <div style="display:flex; gap:8px;">
        <input class="cutoff-input" id="pastCutoffInput" type="text"
          placeholder="YYYY-MM-DD HH:MM"
          style="flex:1; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'IBM Plex Mono',monospace; font-size:13px; padding:11px 14px; outline:none; -webkit-appearance:none;">
        <button class="btn-save-cutoff" id="addPastCutoffBtn" style="padding:11px 16px; font-size:13px;">Add</button>
      </div>
      <div style="font-size:11px; color:var(--muted); margin-top:6px;">Example: 2026-05-23 17:30</div>
      <div class="cutoff-status" id="pastCutoffStatus"></div>
    </div>

    <!-- Payroll cutoff dates list -->
    <div style="margin-top:16px; border-top:1px solid var(--border); padding-top:16px;">
      <div class="section-title" style="margin-bottom:10px;">Payroll Cutoff Dates</div>
      <div id="cutoffList"><div style="color:var(--muted);font-size:14px;"><span class="spinner"></span>Loading…</div></div>
    </div>
  </div>

  <!-- Project management -->
  <div class="section">
    <div class="section-title">Manage Projects</div>
    <div id="projectsList"><div style="color:var(--muted);font-size:14px;"><span class="spinner"></span>Loading…</div></div>
    <div class="add-row">
      <input class="add-input" id="newProjectInput" type="text" placeholder="New project name" maxlength="80">
      <button class="btn-add" id="addProjectBtn">+ Add</button>
    </div>
    <div class="add-status" id="addProjectStatus"></div>
  </div>

  <!-- Pay period summaries -->
  <div class="periods-section">
    <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:var(--label);margin-bottom:14px;">Pay Period Summary</div>
    <div id="periodsContainer">
      <div class="state-msg"><div class="icon"><span class="spinner"></span></div>Loading…</div>
    </div>
  </div>

</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyWJuakrIfHEirLhSih-WGYT3A1etk1wc1I8uYVqrxUDqNyWKl_2lyjpiO4wSKqcrzk/exec";

  // ── On load ──
  loadSummary();
  loadCutoffs();
  loadProjects();

  // ── Mark payroll ──
  document.getElementById('markBtn').addEventListener('click', function() {
    var btn      = document.getElementById('markBtn');
    var statusEl = document.getElementById('markStatus');
    if (!confirm('Mark payroll as submitted right now?')) return;
    btn.disabled     = true;
    btn.innerHTML    = '<span class="spinner"></span>Submitting…';
    statusEl.textContent = '';
    jsonp(SCRIPT_URL + '?action=addPayrollCutoff', '_markCb', function(json) {
      btn.disabled    = false;
      btn.textContent = 'Submit Payroll Now';
      if (json.status === 'ok') {
        statusEl.textContent = '✓ Payroll marked at ' + json.cutoff.substring(0,16);
        statusEl.className   = 'mark-status ok';
        loadSummary(); loadCutoffs();
      } else {
        statusEl.textContent = '✕ ' + (json.message || 'Error');
        statusEl.className   = 'mark-status err';
      }
    });
  });

  // ── Add past cutoff date ──
  document.getElementById('addPastCutoffBtn').addEventListener('click', function() {
    var val      = document.getElementById('pastCutoffInput').value.trim();
    var statusEl = document.getElementById('pastCutoffStatus');
    var btn      = document.getElementById('addPastCutoffBtn');
    if (!val) {
      statusEl.textContent = 'Please enter a date and time.';
      statusEl.className   = 'cutoff-status err';
      return;
    }
    // Pad seconds if missing
    if (val.length === 16) val += ':00';
    btn.disabled = true;
    statusEl.textContent = '';
    jsonp(SCRIPT_URL + '?action=editPayrollCutoff&rowIndex=NEW&newValue=' + encodeURIComponent(val), '_addPastCb', function(json) {
      btn.disabled = false;
      if (json.status === 'ok') {
        statusEl.textContent = '✓ Cutoff date added: ' + val.substring(0,16);
        statusEl.className   = 'cutoff-status ok';
        document.getElementById('pastCutoffInput').value = '';
        loadCutoffs(); loadSummary();
      } else {
        statusEl.textContent = '✕ ' + (json.message || 'Error');
        statusEl.className   = 'cutoff-status err';
      }
    });
  });

  // ── Load + render cutoff dates ──
  function loadCutoffs() {
    jsonp(SCRIPT_URL + '?action=getPayrollCutoffs', '_cutoffsCb', function(json) {
      var container = document.getElementById('cutoffList');
      if (json.status !== 'ok' || !json.cutoffs.length) {
        container.innerHTML = '<div style="color:var(--muted);font-size:14px;">No cutoff dates yet.</div>';
        return;
      }
      container.innerHTML = '<div class="cutoff-list">' +
        json.cutoffs.map(function(c) {
          return '<div class="cutoff-item" id="ci-' + c.index + '">' +
            '<div class="cutoff-view">' +
            '<span class="cutoff-date">' + c.value.substring(0,16) + '</span>' +
            '<div class="cutoff-actions">' +
            '<button class="btn-icon" onclick="toggleCutoffEdit(' + c.index + ')">✏️</button>' +
            '<button class="btn-icon del" onclick="deleteCutoff(' + c.index + ')">🗑</button>' +
            '</div></div>' +
            '<div class="cutoff-edit-form" id="cef-' + c.index + '">' +
            '<div class="cutoff-edit-row">' +
            '<input class="cutoff-input" id="cev-' + c.index + '" type="text" value="' + c.value.substring(0,16) + '" placeholder="YYYY-MM-DD HH:MM">' +
            '<button class="btn-save-cutoff" onclick="saveCutoff(' + c.index + ')">Save</button>' +
            '</div>' +
            '<div class="cutoff-status" id="ces-' + c.index + '"></div>' +
            '</div>' +
            '</div>';
        }).join('') + '</div>';
    });
  }

  function toggleCutoffEdit(idx) {
    var form = document.getElementById('cef-' + idx);
    form.classList.toggle('visible');
  }

  function deleteCutoff(idx) {
    if (!confirm('Delete this payroll cutoff date?')) return;
    jsonp(SCRIPT_URL + '?action=editPayrollCutoff&rowIndex=' + idx + '&delete=true', '_delCutoffCb', function(json) {
      if (json.status === 'ok') { loadCutoffs(); loadSummary(); }
      else alert('Error: ' + json.message);
    });
  }

  function saveCutoff(idx) {
    var val = document.getElementById('cev-' + idx).value.trim();
    var statusEl = document.getElementById('ces-' + idx);
    if (!val) { statusEl.textContent = 'Enter a date.'; statusEl.className = 'cutoff-status err'; return; }
    // Ensure seconds if not provided
    if (val.length === 16) val += ':00';
    jsonp(SCRIPT_URL + '?action=editPayrollCutoff&rowIndex=' + idx + '&newValue=' + encodeURIComponent(val), '_saveCutoffCb', function(json) {
      if (json.status === 'ok') {
        statusEl.textContent = '✓ Saved';
        statusEl.className   = 'cutoff-status ok';
        setTimeout(function() { loadCutoffs(); loadSummary(); }, 800);
      } else {
        statusEl.textContent = '✕ ' + json.message;
        statusEl.className   = 'cutoff-status err';
      }
    });
  }

  // ── Projects ──
  function loadProjects() {
    jsonp(SCRIPT_URL + '?action=getProjects', '_projListCb', function(json) {
      var container = document.getElementById('projectsList');
      if (json.status === 'ok' && json.projects.length > 0) {
        container.innerHTML = '<div class="projects-list">' +
          json.projects.map(function(p) {
            return '<div class="project-item"><span>' + esc(p) + '</span></div>';
          }).join('') + '</div>';
      } else {
        container.innerHTML = '<div style="color:var(--muted);font-size:14px;margin-bottom:14px;">No projects yet.</div>';
      }
    });
  }

  document.getElementById('addProjectBtn').addEventListener('click', function() {
    var name     = document.getElementById('newProjectInput').value.trim();
    var statusEl = document.getElementById('addProjectStatus');
    var btn      = document.getElementById('addProjectBtn');
    if (!name) { statusEl.textContent = 'Enter a project name.'; statusEl.className = 'add-status err'; return; }
    btn.disabled = true;
    statusEl.textContent = '';
    jsonp(SCRIPT_URL + '?action=addProject&name=' + encodeURIComponent(name), '_addProjCb', function(json) {
      btn.disabled = false;
      if (json.status === 'ok') {
        statusEl.textContent = '✓ "' + name + '" added.';
        statusEl.className   = 'add-status ok';
        document.getElementById('newProjectInput').value = '';
        loadProjects();
      } else {
        statusEl.textContent = '✕ ' + (json.message || 'Error');
        statusEl.className   = 'add-status err';
      }
    });
  });

  // ── Pay period summary ──
  function loadSummary() {
    document.getElementById('periodsContainer').innerHTML =
      '<div class="state-msg"><div class="icon"><span class="spinner"></span></div>Loading…</div>';
    jsonp(SCRIPT_URL + '?action=getPayrollSummary', '_summaryCb', function(json) {
      if (json.status !== 'ok') {
        document.getElementById('periodsContainer').innerHTML =
          '<div class="state-msg"><div class="icon">⚠️</div>Could not load. Try refreshing.</div>';
        return;
      }
      renderSummary(json.summary);
    });
  }

  function renderSummary(periods) {
    if (!periods || !periods.length) {
      document.getElementById('periodsContainer').innerHTML =
        '<div class="state-msg"><div class="icon">📋</div>No pay periods yet.</div>';
      return;
    }
    var html = '';
    periods.forEach(function(period, i) {
      var isOpen = period.cutoff === 'Open';
      var total  = period.employees.reduce(function(s,e){ return s + e.hours; }, 0);
      var id     = 'period-' + i;
      html += '<div class="period-card">';
      html += '<div class="period-header" onclick="togglePeriod(\'' + id + '\')">';
      html += '<div><div class="period-label">' + period.label + '</div>';
      html += '<div class="period-cutoff">' + (isOpen ? 'In progress' : 'Submitted ' + period.cutoff) + '</div></div>';
      html += '<span class="period-badge ' + (isOpen ? 'open' : 'closed') + '">' + (isOpen ? 'OPEN' : total.toFixed(1) + ' hrs') + '</span>';
      html += '</div>';
      html += '<div class="period-body' + (i === 0 ? ' visible' : '') + '" id="' + id + '">';
      period.employees.forEach(function(emp) {
        html += '<div class="emp-row"><span class="emp-name">' + emp.name + '</span>';
        html += '<span class="emp-hrs' + (emp.hours === 0 ? ' zero' : '') + '">' + (emp.hours > 0 ? emp.hours.toFixed(1) + ' hrs' : '—') + '</span></div>';
      });
      html += '<div class="period-total"><span class="period-total-label">Total</span><span class="period-total-val">' + total.toFixed(1) + ' hrs</span></div>';
      html += '</div></div>';
    });
    document.getElementById('periodsContainer').innerHTML = html;
  }

  function togglePeriod(id) { document.getElementById(id).classList.toggle('visible'); }

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  // ── JSONP helper ──
  function jsonp(url, cbName, fn) {
    var old = document.getElementById('jsonp-' + cbName);
    if (old) old.parentNode.removeChild(old);
    window[cbName] = function(json) {
      var el = document.getElementById('jsonp-' + cbName);
      if (el) el.parentNode.removeChild(el);
      fn(json);
    };
    var s  = document.createElement('script');
    s.id   = 'jsonp-' + cbName;
    s.src  = url + '&callback=' + cbName + '&_t=' + Date.now();
    s.onerror = function() { fn({ status:'error', message:'Network error' }); };
    document.head.appendChild(s);
  }
</script>
</body>
</html>
